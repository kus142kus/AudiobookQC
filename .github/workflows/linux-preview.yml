# Opt-in Linux x86_64 preview. It never changes or blocks the tested
# Windows/macOS release workflow, and is not published as a stable release.
name: Audiobook QC - experimental Linux x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-preview:
    name: Linux x86_64 preview (manual only)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check actual Linux architecture
        shell: bash
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
      - name: Install native Qt runtime libraries and virtual X display
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-xinerama0 libnss3 libgbm1 libasound2t64 libdbus-1-3 libportaudio2
      - name: Install CPU-only PyTorch and source build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-build.txt
          python -m pip install --force-reinstall setuptools==80.9.0
          python -m pip check
      - name: Check source, tests and the real Qt GUI before huge model downloads
        shell: bash
        env:
          QTWEBENGINE_DISABLE_SANDBOX: '1'
          QTWEBENGINE_CHROMIUM_FLAGS: '--no-sandbox --disable-gpu'
        run: |
          python scripts/preflight_source.py
          python -m unittest discover -s tests -v
          xvfb-run -a python run.py --smoke-gui
      - name: Download and verify bundled offline speech and event models
        shell: bash
        run: |
          python scripts/get_offline_model.py
          python scripts/get_event_model.py
      - name: Build Linux preview without network fallback
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name AudiobookQC --paths src \
            --hidden-import webview.platforms.qt \
            --hidden-import PySide6.QtWebEngineWidgets \
            --hidden-import PySide6.QtWebEngineCore \
            --hidden-import PySide6.QtWebChannel \
            --exclude-module pythonnet --exclude-module clr --exclude-module clr_loader \
            --exclude-module webview.platforms.winforms \
            --add-data 'models:models' --add-data 'web:web' \
            --add-data 'LICENSE:.' --add-data 'THIRD_PARTY_NOTICES.md:.' \
            --collect-all webview \
            --collect-all imageio_ffmpeg \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all av \
            --collect-all tokenizers \
            --collect-all sounddevice \
            --collect-all transformers \
            --collect-all torchaudio \
            --collect-all omegaconf \
            --collect-all hydra \
            --collect-all sentencepiece \
            --collect-all onnxruntime \
            run.py
      - name: Confirm Linux preview opens and all three models work without internet
        shell: bash
        timeout-minutes: 25
        env:
          QTWEBENGINE_DISABLE_SANDBOX: '1'
          QTWEBENGINE_CHROMIUM_FLAGS: '--no-sandbox --disable-gpu'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: xvfb-run -a python scripts/check_bundle.py dist/AudiobookQC/AudiobookQC
      - name: Pack only the verified Linux application
        shell: bash
        run: |
          tar -czf dist/AudiobookQC-Linux-x64-PREVIEW.tar.gz -C dist AudiobookQC
          sha256sum dist/AudiobookQC-Linux-x64-PREVIEW.tar.gz > dist/AudiobookQC-Linux-x64-PREVIEW.tar.gz.sha256
      - name: Upload opt-in Linux preview (not a stable public release)
        uses: actions/upload-artifact@v4
        with:
          name: AQC-Linux-x64-PREVIEW
          path: |
            dist/AudiobookQC-Linux-x64-PREVIEW.tar.gz
            dist/AudiobookQC-Linux-x64-PREVIEW.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
