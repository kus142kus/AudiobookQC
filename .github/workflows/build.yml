name: Audiobook QC 0.9 - offline release assets

on:
  workflow_dispatch:
    inputs:
      publish_beta:
        description: 'Publish a public prerelease after Windows and Mac tests pass'
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'run.py'
      - '.github/workflows/build.yml'
      - 'installer/**'

permissions:
  contents: read

jobs:
  build:
    name: Offline ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: Windows-x64
          - os: macos-15
            target: Mac-Apple-Silicon
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python for CI only (embedded into app later)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify actual runner OS and architecture BEFORE costly setup
        shell: bash
        run: python scripts/check_ci_platform.py "${{ matrix.target }}"
      - name: Prefer CPU-only PyTorch on Windows to avoid GPU/CUDA bundles
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-build.txt
          # PyInstaller pkg_resources runtime hook needs the legacy provider.
          # setuptools 82+ removed pkg_resources; pin on build machines only.
          python -m pip install --force-reinstall setuptools==80.9.0
          python -c "import pkg_resources; assert hasattr(pkg_resources, 'NullProvider'), 'incompatible setuptools/pkg_resources'"
          python -m pip cache purge || true
      - name: Audit pinned ASR dependencies and optional imports
        shell: bash
        run: |
          python -m pip check
          python - <<'PYCODE'
          import torch, torchaudio, transformers, hydra, omegaconf, sentencepiece
          assert torch.__version__.split('+')[0] == '2.8.0'
          assert torchaudio.__version__.split('+')[0] == '2.8.0'
          assert transformers.__version__ == '4.57.1'
          print('Dependency audit passed:', torch.__version__, transformers.__version__, flush=True)
          PYCODE
      - name: Audit all source imports and UI-to-backend methods BEFORE model download
        shell: bash
        run: python scripts/preflight_source.py
      - name: Verify installer/release tag and publication contract BEFORE model downloads
        shell: bash
        run: python scripts/verify_release_contract.py
      - name: Run source unit and integration tests
        shell: bash
        run: python -m unittest discover -s tests -v
      - name: Exercise native desktop renderer BEFORE downloading models
        shell: bash
        run: |
          # Launch the ACTUAL GUI using the same renderer selected in production.
          # A broken UI must fail before multi-GB model downloads.
          python run.py --smoke-gui
      - name: Confirm Windows GUI avoids pythonnet / WinForms
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PYCODE'
          from PySide6.QtWebEngineWidgets import QWebEngineView
          from PySide6.QtWebChannel import QWebChannel
          import sys
          sys.path.insert(0, 'src')
          from audiobook_qc.desktop_web import preferred_gui_backend, verify_gui_backend
          assert preferred_gui_backend() == 'qt'
          assert verify_gui_backend() == 'qt'
          print('AUDIOBOOK_QC_WINDOWS_QT_WEBENGINE_OK', flush=True)
          PYCODE
      - name: Test one-click Windows installer source BEFORE downloading models
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/build_installer.py --self-test
      - name: Install Inno Setup compiler on GitHub runner (never on user PC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare Inno Setup compiler' }
      - name: Exercise actual Windows installer installation and removal BEFORE downloading models
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/build_installer.py --test-inno
      - name: Download and checksum BOTH models on BUILD MACHINE ONLY
        shell: bash
        run: python scripts/get_offline_model.py
      - name: Download and checksum local sound-event model (YAMNet)
        shell: bash
        run: python scripts/get_event_model.py
      - name: Verify offline event model and perform 3-second ONNX inference
        shell: bash
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python - <<'PYCODE'
          import sys, tempfile, wave
          from pathlib import Path
          sys.path.insert(0,'src')
          from audiobook_qc.events import AudioEventDetector
          detector = AudioEventDetector()
          with tempfile.TemporaryDirectory() as td:
              wav=Path(td)/'test.wav'
              with wave.open(str(wav),'wb') as f:
                  f.setnchannels(1); f.setsampwidth(2); f.setframerate(16000)
                  f.writeframes(b'\x00\x00'*16000*3)
              result=detector.inspect(wav,0,0,3)
              assert isinstance(result,list)
          print('AUDIOBOOK_QC_YAMNET_REAL_INFERENCE_OK',flush=True)
          PYCODE
      - name: Verify downloaded GigaAM shortform-only patch and checksum
        shell: bash
        run: |
          python - <<'PYCODE'
          import sys
          sys.path.insert(0, 'src')
          from audiobook_qc.dual_engine import check_model_hash
          from pathlib import Path
          folder = Path('models/gigaam')
          check_model_hash(folder)
          text = (folder/'modeling_gigaam.py').read_text(encoding='utf-8')
          assert 'from pyannote.audio import' not in text
          assert 'from pyannote.audio.pipelines import' not in text
          print('GigaAM bundle checks and optional-import audit passed', flush=True)
          PYCODE
      - name: Preflight independent GigaAM before packaging (diagnose model vs PyInstaller)
        shell: bash
        timeout-minutes: 10
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python - <<'PYCODE'
          import faulthandler
          import sys
          import tempfile
          import wave
          from pathlib import Path
          sys.path.insert(0, 'src')
          faulthandler.dump_traceback_later(90, repeat=True)
          from audiobook_qc.dual_engine import load_secondary_model, extract_transcription_text
          try:
              print('GigaAM plain Python preflight: starting', flush=True)
              model = load_secondary_model(validate_hash=False, on_stage=lambda s: print(s, flush=True))
              with tempfile.TemporaryDirectory(prefix='aqc-ci-gigaam-') as name:
                  wav = Path(name) / 'silence.wav'
                  with wave.open(str(wav), 'wb') as out:
                      out.setnchannels(1)
                      out.setsampwidth(2)
                      out.setframerate(16000)
                      out.writeframes(b'\x00\x00' * 16000)
                  print('GigaAM plain Python preflight: running 1s inference', flush=True)
                  result = model.transcribe(str(wav))
                  assert isinstance(extract_transcription_text(result), str)
              print('AUDIOBOOK_QC_GIGAAM_PYTHON_PREFLIGHT_OK', flush=True)
          finally:
              faulthandler.cancel_dump_traceback_later()
          PYCODE
      - name: Check free disk space before packaging
        shell: bash
        run: |
          python -c "import shutil; s=shutil.disk_usage('.'); print('Available GiB:',round(s.free/(1024**3),2)); assert s.free > 3*1024**3, 'Insufficient disk for bundled models'"
      - name: Build self-contained app (native offline UI, Qt on Windows)
        shell: bash
        run: |
          extra=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Keep the .NET pythonnet runtime OUT of the Windows executable.
            # Force and bundle the same Qt WebEngine used by the preflight.
            extra+=(--hidden-import webview.platforms.qt)
            extra+=(--hidden-import PySide6.QtWebEngineWidgets)
            extra+=(--hidden-import PySide6.QtWebEngineCore)
            extra+=(--hidden-import PySide6.QtWebChannel)
            extra+=(--exclude-module pythonnet --exclude-module clr --exclude-module clr_loader)
            extra+=(--exclude-module webview.platforms.winforms)
            extra+=(--exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2)
          fi
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            "${extra[@]}" \
            --name AudiobookQC --paths src \
            --add-data 'models:models' \
            --add-data 'web:web' \
            --add-data 'LICENSE:.' \
            --add-data 'THIRD_PARTY_NOTICES.md:.' \
            --collect-all webview \
            --collect-all imageio_ffmpeg \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all av \
            --collect-all tokenizers \
            --collect-all sounddevice \
            --collect-all transformers \
            --collect-all torchaudio \
            --collect-all omegaconf \
            --collect-all hydra \
            --collect-all sentencepiece \
            --collect-all onnxruntime \
            run.py
      - name: Verify REAL frozen GUI and all bundled local models
        shell: bash
        run: |
          python scripts/check_bundle.py "${{ runner.os == 'Windows' && 'dist/AudiobookQC/AudiobookQC.exe' || 'dist/AudiobookQC.app/Contents/MacOS/AudiobookQC' }}"
      - name: Prepare Windows model ZIP and application core automatically
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/build_installer.py --prepare
      - name: Build one-click Windows installer with automatic model installation
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/build_installer.py --compile
      - name: Verify every native macOS library targets Apple Silicon
        if: runner.os == 'macOS'
        shell: bash
        run: python scripts/macos_bundle_audit.py dist/AudiobookQC.app
      - name: DMG Apple Silicon app with Applications shortcut
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/dmg-root
          mv dist/AudiobookQC.app dist/dmg-root/AudiobookQC.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname 'Audiobook QC Offline' \
            -srcfolder dist/dmg-root -ov -format UDZO \
            dist/AudiobookQC-Mac.dmg
      - name: Verify DMG and drag-to-Applications layout (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil verify dist/AudiobookQC-Mac.dmg
          mkdir -p "$RUNNER_TEMP/aqc-mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/aqc-mount" dist/AudiobookQC-Mac.dmg
          trap 'hdiutil detach "$RUNNER_TEMP/aqc-mount" || true' EXIT
          test -d "$RUNNER_TEMP/aqc-mount/AudiobookQC.app"
          test -L "$RUNNER_TEMP/aqc-mount/Applications"
      - name: Verify release sizes, integrity and SHA256
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            python scripts/check_release_assets.py dist/AQC-Setup.exe
            python scripts/check_release_assets.py dist/AQC-Model.zip
          else
            python scripts/check_release_assets.py dist/AudiobookQC-Mac.dmg
          fi
      - name: Upload Windows ONE-CLICK installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: AQC-Setup
          path: |
            dist/AQC-Setup.exe
            dist/AQC-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 15
      - name: Upload installer-managed model for same GitHub Release
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: AQC-Model
          path: |
            dist/AQC-Model.zip
            dist/AQC-Model.zip.sha256
          if-no-files-found: error
          retention-days: 15
      - name: Upload Mac Apple Silicon DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: AQC-Mac-M4
          path: |
            dist/AudiobookQC-Mac.dmg
            dist/AudiobookQC-Mac.dmg.sha256
          if-no-files-found: error
          retention-days: 15

  release:
    name: Publish tested one-click beta (explicit opt-in only)
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_beta == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release docs
        uses: actions/checkout@v4
      - name: Collect ALL tested packages from THIS run
        uses: actions/download-artifact@v4
        with:
          pattern: AQC-*
          merge-multiple: true
          path: release
      - name: Verify build-produced checksums WITHOUT rewriting them
        shell: bash
        run: |
          python scripts/verify_release_contract.py
          python scripts/check_release_assets.py --verify \
            release/AQC-Setup.exe release/AQC-Model.zip release/AudiobookQC-Mac.dmg
      - name: Publish GitHub public prerelease with direct EXE and DMG links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.1-beta.1
          target_commitish: ${{ github.sha }}
          name: Audiobook QC 0.9.1 Beta — Windows & macOS Apple Silicon
          body_path: docs/RELEASE_BETA.md
          draft: false
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release/AQC-Setup.exe
            release/AQC-Model.zip
            release/AudiobookQC-Mac.dmg
            release/*.sha256
