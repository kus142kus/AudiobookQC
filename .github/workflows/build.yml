name: Audiobook QC 0.6 - native offline desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'run.py'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Offline ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: Windows-x64
          - os: macos-15
            target: Mac-Apple-Silicon
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python for CI only (embedded into app later)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prefer CPU-only PyTorch on Windows to avoid GPU/CUDA bundles
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-build.txt
          python -m pip cache purge || true
      - name: Run source unit and integration tests
        shell: bash
        run: python -m unittest discover -s tests -v
      - name: Download and checksum BOTH models on BUILD MACHINE ONLY
        shell: bash
        run: python scripts/get_offline_model.py
      - name: Check free disk space before packaging
        shell: bash
        run: |
          python -c "import shutil; s=shutil.disk_usage('.'); print('Available GiB:',round(s.free/(1024**3),2)); assert s.free > 3*1024**3, 'Insufficient disk for bundled models'"
      - name: Build self-contained app (no browser, no model downloads at runtime)
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name AudiobookQC --paths src \
            --add-data 'models:models' \
            --collect-all imageio_ffmpeg \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all av \
            --collect-all tokenizers \
            --collect-all sounddevice \
            --collect-all gigaam \
            --collect-all transformers \
            --collect-all torchaudio \
            --collect-all omegaconf \
            --collect-all hydra \
            --collect-all sentencepiece \
            run.py
      - name: Smoke test packaged EXE / app with real LOCAL models
        shell: bash
        run: |
          python scripts/check_bundle.py "${{ runner.os == 'Windows' && 'dist/AudiobookQC/AudiobookQC.exe' || 'dist/AudiobookQC.app/Contents/MacOS/AudiobookQC' }}"
      - name: ZIP Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AudiobookQC -DestinationPath dist/AudiobookQC-Windows-x64-offline.zip -Force
      - name: DMG Apple Silicon app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil create -volname 'Audiobook QC Offline' \
            -srcfolder dist/AudiobookQC.app -ov -format UDZO \
            dist/AudiobookQC-Mac-Apple-Silicon-offline.dmg
      - name: Upload tested package
        uses: actions/upload-artifact@v4
        with:
          name: AudiobookQC-${{ matrix.target }}-offline
          path: |
            dist/AudiobookQC-${{ matrix.target }}-offline.zip
            dist/AudiobookQC-${{ matrix.target }}-offline.dmg
          if-no-files-found: error
          retention-days: 15
