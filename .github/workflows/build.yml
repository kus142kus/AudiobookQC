name: Audiobook QC 0.9 - offline release assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'run.py'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Offline ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: Windows-x64
          - os: macos-15
            target: Mac-Apple-Silicon
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python for CI only (embedded into app later)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify actual runner OS and architecture BEFORE costly setup
        shell: bash
        run: python scripts/check_ci_platform.py "${{ matrix.target }}"
      - name: Prefer CPU-only PyTorch on Windows to avoid GPU/CUDA bundles
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-build.txt
          # PyInstaller pkg_resources runtime hook needs the legacy provider.
          # setuptools 82+ removed pkg_resources; pin on build machines only.
          python -m pip install --force-reinstall setuptools==80.9.0
          python -c "import pkg_resources; assert hasattr(pkg_resources, 'NullProvider'), 'incompatible setuptools/pkg_resources'"
          python -m pip cache purge || true
      - name: Audit pinned ASR dependencies and optional imports
        shell: bash
        run: |
          python -m pip check
          python - <<'PYCODE'
          import torch, torchaudio, transformers, hydra, omegaconf, sentencepiece
          assert torch.__version__.split('+')[0] == '2.8.0'
          assert torchaudio.__version__.split('+')[0] == '2.8.0'
          assert transformers.__version__ == '4.57.1'
          print('Dependency audit passed:', torch.__version__, transformers.__version__, flush=True)
          PYCODE
      - name: Audit all source imports and UI-to-backend methods BEFORE model download
        shell: bash
        run: python scripts/preflight_source.py
      - name: Run source unit and integration tests
        shell: bash
        run: python -m unittest discover -s tests -v
      - name: Exercise native desktop renderer BEFORE downloading models
        shell: bash
        run: |
          # Launch the ACTUAL GUI using the same renderer selected in production.
          # A broken UI must fail before multi-GB model downloads.
          python run.py --smoke-gui
      - name: Confirm Windows GUI avoids pythonnet / WinForms
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PYCODE'
          from PySide6.QtWebEngineWidgets import QWebEngineView
          from PySide6.QtWebChannel import QWebChannel
          import sys
          sys.path.insert(0, 'src')
          from audiobook_qc.desktop_web import preferred_gui_backend, verify_gui_backend
          assert preferred_gui_backend() == 'qt'
          assert verify_gui_backend() == 'qt'
          print('AUDIOBOOK_QC_WINDOWS_QT_WEBENGINE_OK', flush=True)
          PYCODE
      - name: Prepare and self-test Windows ZIP packager BEFORE downloading models
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cat > aqc_pack_windows.py <<'PYCODE'
          from __future__ import annotations
          import hashlib
          import sys
          import tempfile
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          LIMIT = 2 * 1024 ** 3
          ROOT = Path('dist/AudiobookQC')
          OUT = Path('dist')
          CORE = OUT / 'AudiobookQC-Win.zip'
          WHISPER = OUT / 'AudiobookQC-Model.zip'


          def run(root=ROOT, core=CORE, model=WHISPER, limit=LIMIT):
              root = Path(root)
              core = Path(core)
              model = Path(model)
              if not (root / 'AudiobookQC.exe').is_file():
                  raise RuntimeError('Windows EXE missing from frozen distribution')
              if not root.is_dir():
                  raise RuntimeError('PyInstaller distribution missing')

              all_files = sorted(f for f in root.rglob('*') if f.is_file())
              files_main, files_model = [], []
              for f in all_files:
                  rel_parts = f.relative_to(root).parts
                  # PyInstaller --onedir stores data under _internal/models/medium/.
                  for pos, part in enumerate(rel_parts):
                      if (part == 'models' and len(rel_parts) > pos + 2
                              and rel_parts[pos + 1] == 'medium'):
                          files_model.append(f)
                          break
                  else:
                      files_main.append(f)

              if not any(f.name == 'model.bin' for f in files_model):
                  raise RuntimeError('Whisper model.bin not found in packaged models/medium')
              if not any('gigaam' in f.parts for f in files_main):
                  raise RuntimeError('GigaAM absent from Windows core package')
              if not any('yamnet' in str(f).lower() for f in files_main):
                  raise RuntimeError('YAMNet absent from Windows core package')

              install_note = (
                  'AUDiOBOOK QC — WINDOWS (офлайн)\n\n'
                  'НУЖНЫ ОБА АРХИВА: AudiobookQC-Win.zip и AudiobookQC-Model.zip.\n'
                  'В Проводнике Windows для каждого ZIP нажмите «Извлечь все»,\n'
                  'укажите ОДНУ И ТУ ЖЕ папку назначения, например C:\\AQC-install.\n'
                  'После объединения файлов запустите AudiobookQC\\AudiobookQC.exe.\n'
                  'Python и интернет для запуска не требуются.\n'
              )
              for target, files in ((core, files_main), (model, files_model)):
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.unlink(missing_ok=True)
                  with ZipFile(target, mode='w', compression=ZIP_DEFLATED, compresslevel=6, allowZip64=True) as output:
                      for f in files:
                          archive_name = f.relative_to(root.parent).as_posix()
                          output.write(f, archive_name)
                      output.writestr('INSTALL.txt', install_note.encode('utf-8-sig'))
                  if target.stat().st_size >= limit:
                      raise RuntimeError(f'{target.name} too large for GitHub Release: {target.stat().st_size / 1024 ** 3:.2f} GiB')
                  with ZipFile(target) as zipped:
                      names = set(zipped.namelist())
                      expected = {f.relative_to(root.parent).as_posix() for f in files}
                      expected.add('INSTALL.txt')
                      if names != expected:
                          raise RuntimeError(f'ZIP entry mismatch in {target.name}')
                      corrupt = zipped.testzip()
                      if corrupt is not None:
                          raise RuntimeError(f'ZIP corruption in {target.name}: {corrupt}')
                  with target.open('rb') as src:
                      sha = hashlib.file_digest(src, 'sha256').hexdigest()
                  (target.parent / (target.name + '.sha256')).write_text(f'{sha}  {target.name}\n', encoding='ascii')
                  print(f'RELEASE_ASSET_OK {target.name}: {target.stat().st_size / 1024**3:.2f} GiB, {len(files)} files', flush=True)
              print('AUDIOBOOK_QC_WINDOWS_TWO_ARCHIVES_RECONSTRUCT_FULL_PACKAGE', flush=True)
              return core, model


          def self_test():
              """Run a real extract-and-compare test WITHOUT downloading speech models."""
              with tempfile.TemporaryDirectory(prefix='aqc-release-test-') as tmp:
                  folder = Path(tmp)
                  root = folder / 'dist' / 'AudiobookQC'
                  samples = {
                      'AudiobookQC.exe': b'MZtest',
                      '_internal/models/medium/model.bin': b'whisper' * 900,
                      '_internal/models/medium/config.json': b'{}',
                      '_internal/models/gigaam/pytorch_model.bin': b'gigaam' * 700,
                      '_internal/models/events/yamnet.onnx': b'yamnet' * 300,
                      '_internal/web/index.html': b'index',
                  }
                  for name, payload in samples.items():
                      target = root / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(payload)
                  app_zip, model_zip = run(root, folder/'app.zip', folder/'model.zip')
                  dest = folder / 'installed'
                  for archive in (app_zip, model_zip):
                      with ZipFile(archive) as z:
                          z.extractall(dest)
                  for name, payload in samples.items():
                      actual = (dest/'AudiobookQC'/name).read_bytes()
                      if actual != payload:
                          raise RuntimeError('Release reconstruction failed: ' + name)
                  if not (dest/'INSTALL.txt').is_file():
                      raise RuntimeError('Release install instructions missing')
              print('AUDIOBOOK_QC_RELEASE_PACKAGING_SELF_TEST_OK', flush=True)


          if __name__ == '__main__':
              if '--self-test' in sys.argv:
                  self_test()
              else:
                  run()
          PYCODE
          python aqc_pack_windows.py --self-test
      - name: Download and checksum BOTH models on BUILD MACHINE ONLY
        shell: bash
        run: python scripts/get_offline_model.py
      - name: Download and checksum local sound-event model (YAMNet)
        shell: bash
        run: python scripts/get_event_model.py
      - name: Verify offline event model and perform 3-second ONNX inference
        shell: bash
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python - <<'PYCODE'
          import sys, tempfile, wave
          from pathlib import Path
          sys.path.insert(0,'src')
          from audiobook_qc.events import AudioEventDetector
          detector = AudioEventDetector()
          with tempfile.TemporaryDirectory() as td:
              wav=Path(td)/'test.wav'
              with wave.open(str(wav),'wb') as f:
                  f.setnchannels(1); f.setsampwidth(2); f.setframerate(16000)
                  f.writeframes(b'\x00\x00'*16000*3)
              result=detector.inspect(wav,0,0,3)
              assert isinstance(result,list)
          print('AUDIOBOOK_QC_YAMNET_REAL_INFERENCE_OK',flush=True)
          PYCODE
      - name: Verify downloaded GigaAM shortform-only patch and checksum
        shell: bash
        run: |
          python - <<'PYCODE'
          import sys
          sys.path.insert(0, 'src')
          from audiobook_qc.dual_engine import check_model_hash
          from pathlib import Path
          folder = Path('models/gigaam')
          check_model_hash(folder)
          text = (folder/'modeling_gigaam.py').read_text(encoding='utf-8')
          assert 'from pyannote.audio import' not in text
          assert 'from pyannote.audio.pipelines import' not in text
          print('GigaAM bundle checks and optional-import audit passed', flush=True)
          PYCODE
      - name: Preflight independent GigaAM before packaging (diagnose model vs PyInstaller)
        shell: bash
        timeout-minutes: 10
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python - <<'PYCODE'
          import faulthandler
          import sys
          import tempfile
          import wave
          from pathlib import Path
          sys.path.insert(0, 'src')
          faulthandler.dump_traceback_later(90, repeat=True)
          from audiobook_qc.dual_engine import load_secondary_model, extract_transcription_text
          try:
              print('GigaAM plain Python preflight: starting', flush=True)
              model = load_secondary_model(validate_hash=False, on_stage=lambda s: print(s, flush=True))
              with tempfile.TemporaryDirectory(prefix='aqc-ci-gigaam-') as name:
                  wav = Path(name) / 'silence.wav'
                  with wave.open(str(wav), 'wb') as out:
                      out.setnchannels(1)
                      out.setsampwidth(2)
                      out.setframerate(16000)
                      out.writeframes(b'\x00\x00' * 16000)
                  print('GigaAM plain Python preflight: running 1s inference', flush=True)
                  result = model.transcribe(str(wav))
                  assert isinstance(extract_transcription_text(result), str)
              print('AUDIOBOOK_QC_GIGAAM_PYTHON_PREFLIGHT_OK', flush=True)
          finally:
              faulthandler.cancel_dump_traceback_later()
          PYCODE
      - name: Check free disk space before packaging
        shell: bash
        run: |
          python -c "import shutil; s=shutil.disk_usage('.'); print('Available GiB:',round(s.free/(1024**3),2)); assert s.free > 3*1024**3, 'Insufficient disk for bundled models'"
      - name: Build self-contained app (native offline UI, Qt on Windows)
        shell: bash
        run: |
          extra=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Keep the .NET pythonnet runtime OUT of the Windows executable.
            # Force and bundle the same Qt WebEngine used by the preflight.
            extra+=(--hidden-import webview.platforms.qt)
            extra+=(--hidden-import PySide6.QtWebEngineWidgets)
            extra+=(--hidden-import PySide6.QtWebEngineCore)
            extra+=(--hidden-import PySide6.QtWebChannel)
            extra+=(--exclude-module pythonnet --exclude-module clr --exclude-module clr_loader)
            extra+=(--exclude-module webview.platforms.winforms)
            extra+=(--exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2)
          fi
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            "${extra[@]}" \
            --name AudiobookQC --paths src \
            --add-data 'models:models' \
            --add-data 'web:web' \
            --add-data 'LICENSE:.' \
            --add-data 'THIRD_PARTY_NOTICES.md:.' \
            --collect-all webview \
            --collect-all imageio_ffmpeg \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all av \
            --collect-all tokenizers \
            --collect-all sounddevice \
            --collect-all transformers \
            --collect-all torchaudio \
            --collect-all omegaconf \
            --collect-all hydra \
            --collect-all sentencepiece \
            --collect-all onnxruntime \
            run.py
      - name: Verify REAL frozen GUI and all bundled local models
        shell: bash
        run: |
          python scripts/check_bundle.py "${{ runner.os == 'Windows' && 'dist/AudiobookQC/AudiobookQC.exe' || 'dist/AudiobookQC.app/Contents/MacOS/AudiobookQC' }}"
      - name: Package Windows into TWO standard ZIP files below GitHub Release 2 GiB limit
        if: runner.os == 'Windows'
        shell: bash
        run: python aqc_pack_windows.py
      - name: Verify every native macOS library targets Apple Silicon
        if: runner.os == 'macOS'
        shell: bash
        run: python scripts/macos_bundle_audit.py dist/AudiobookQC.app
      - name: DMG Apple Silicon app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil create -volname 'Audiobook QC Offline' \
            -srcfolder dist/AudiobookQC.app -ov -format UDZO \
            dist/AudiobookQC-Mac.dmg
      - name: Verify DMG integrity (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: hdiutil verify dist/AudiobookQC-Mac.dmg
      - name: Verify public-release size, ZIP integrity, and SHA256
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            python scripts/check_release_assets.py dist/AudiobookQC-Win.zip
            # The packaging script already verifies the Whisper ZIP's size,
            # file list, CRC integrity, and SHA256 before uploading the assets.
            test -s dist/AudiobookQC-Model.zip.sha256
          else
            python scripts/check_release_assets.py dist/AudiobookQC-Mac.dmg
          fi
      - name: Upload Windows app (part 1 of 2)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: AQC-Win
          path: |
            dist/AudiobookQC-Win.zip
            dist/AudiobookQC-Win.zip.sha256
          if-no-files-found: error
          retention-days: 15
      - name: Upload Windows offline model (part 2 of 2)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: AQC-Model
          path: |
            dist/AudiobookQC-Model.zip
            dist/AudiobookQC-Model.zip.sha256
          if-no-files-found: error
          retention-days: 15
      - name: Upload Mac Apple Silicon DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: AQC-Mac-M4
          path: |
            dist/AudiobookQC-Mac.dmg
            dist/AudiobookQC-Mac.dmg.sha256
          if-no-files-found: error
          retention-days: 15
